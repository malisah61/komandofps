name: Derle (Android + PC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: derle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ve export şablonlarını önbellekten al
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Godot indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf templates Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Projeyi içe aktar
        run: |
          chmod +x ~/godot/godot
          ~/godot/godot --headless --import || true

      - name: "Oyun testi (her bölüm - navmesh, devriye, görülme, bıçak, görev)"
        run: |
          for i in 0 1 2 3 4 5 6; do
            ~/godot/godot --headless -s res://tests/sim.gd -- --test-level=res://levels/bolum$i.json 2>&1 | grep -v 'Parameter "m"\|mesh_storage.h' | tee -a test.log
          done
          grep -q "KALDI\|SCRIPT ERROR" test.log && { echo "::error::Test başarısız"; exit 1; } || echo "Bütün testler geçti"

      - name: PC derlemesi (Windows + Linux)
        run: |
          mkdir -p build/windows build/linux build/dist
          ~/godot/godot --headless --export-release "Windows" build/windows/KomandoFPS.exe
          ~/godot/godot --headless --export-release "Linux" build/linux/KomandoFPS.x86_64
          cd build/windows && zip -q -r ../dist/KomandoFPS-Windows.zip . && cd ../..
          cd build/linux && chmod +x KomandoFPS.x86_64 && zip -q -r ../dist/KomandoFPS-Linux.zip . && cd ../..
          ls -la build/dist

      - name: Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android APK derlemesi
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$PWD/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          mkdir -p build/android
          ~/godot/godot --headless --export-release "Android" build/android/komandofps.apk
          ls -la build/android

      - name: Sürüm notu
        run: |
          {
            echo "Otomatik derleme: ${{ github.sha }}"
            echo
            echo "| Dosya | Boyut |"
            echo "|---|---|"
            for f in build/android/komandofps.apk build/dist/*.zip; do echo "| $(basename $f) | $(du -h $f | cut -f1) |"; done
          } > build/surum_notu.md
          cat build/surum_notu.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: komandofps
          path: |
            build/android/komandofps.apk
            build/dist/*.zip

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Komando FPS - son sürüm
          body_path: build/surum_notu.md
          files: |
            build/android/komandofps.apk
            build/dist/KomandoFPS-Windows.zip
            build/dist/KomandoFPS-Linux.zip
          make_latest: true
